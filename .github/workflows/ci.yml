name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (fetches FreeRTOS-Kernel V11.1.0)
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Run demos and unit tests
        working-directory: build
        run: ctest --output-on-failure --timeout 120
